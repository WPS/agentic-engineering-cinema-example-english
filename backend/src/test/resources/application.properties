# Test configuration: tests run on the in-memory H2.
# The file-based training database from src/main/resources/application.properties
# (incl. ddl-auto=create) only applies to the application start — for the tests it would
# wipe the data of already running, cached test contexts on every context start.
spring.application.name=KinoSoft
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS film_selection\\;CREATE SCHEMA IF NOT EXISTS ticket_sale
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
# No SQL initialization: data is filled at runtime by the WeeklyPlanFixture.
spring.sql.init.mode=never
