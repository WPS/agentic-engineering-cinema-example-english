spring.application.name=KinoSoft
spring.datasource.url=jdbc:h2:file:./data/kinosoft;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS film_selection\\;CREATE SCHEMA IF NOT EXISTS ticket_sale
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# create instead of update: weekly planning generates new screening IDs on every start —
# in a persistent database every restart would duplicate the demo data. With create the
# file-based H2 starts empty and the fixtures fill it afresh.
# (The tests run on the in-memory configuration in src/test/resources.)
spring.jpa.hibernate.ddl-auto=create
# No SQL initialization: film selection and ticket sale are filled at runtime from the weekly
# plan (see WeeklyPlanFixture). The H2 schemas are created by the INIT part of the datasource
# URL, the tables by Hibernate (ddl-auto=create).
spring.sql.init.mode=never
logging.file.name=logs/kinosoft-backend.log
